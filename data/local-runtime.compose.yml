# Local runtime settings; application source follows origin/main.
services:
  ollama:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
  soc-ai-app:
    environment:
      RUNTIME_DB_PATH: /app/runtime/soc_runtime.sqlite3
    volumes:
      - runtime_db:/app/runtime
volumes:
  runtime_db:
    name: soc-ai_runtime_db
