<!-- Centralized settings for ubuntu-agent. Do not duplicate Zeek local blocks. -->
<agent_config name="^ubuntu-agent$">
  <rootcheck><disabled>no</disabled></rootcheck>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/dns.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/conn.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/http.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/ssh.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/ssl.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/notice.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/files.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/dhcp.log</location><only-future-events>yes</only-future-events></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zeek/logs/current/weird.log</location><only-future-events>yes</only-future-events></localfile>
</agent_config>
