<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output><alerts_log>yes</alerts_log>
    <logall>no</logall><logall_json>yes</logall_json><email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>
  <alerts><log_alert_level>3</log_alert_level></alerts>
  <logging><log_format>plain</log_format></logging>
  <remote><connection>secure</connection><port>1514</port><protocol>tcp</protocol><queue_size>16384</queue_size></remote>
  <auth>
    <disabled>no</disabled><port>1515</port><use_source_ip>no</use_source_ip><purge>no</purge>
    <use_password>yes</use_password><ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert><ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir><rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list><list>etc/lists/amazon/aws-eventnames</list><list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <decoder_dir>etc/decoders</decoder_dir><rule_dir>etc/rules</rule_dir>
  </ruleset>
  <integration><name>custom-soc-ai</name><level>3</level><alert_format>json</alert_format></integration>
  <syscheck><disabled>yes</disabled></syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <vulnerability-detection><enabled>no</enabled><index-status>no</index-status></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
  <active-response><disabled>yes</disabled></active-response>
  <cluster><disabled>yes</disabled></cluster>
</ossec_config>
